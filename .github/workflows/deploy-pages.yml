name: 驗證與 GitHub Pages 部署

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('pages-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    # 保留分支保護的既有名稱；實際只執行明列的局部案例。
    name: 完整驗證
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.scope.outputs.release }}
    env:
      VALIDATION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: 取得來源與基底
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: 讀取必要環境
        id: prepare
        run: python -B tools/codex/專案驗證.py --prepare --evidence-dir "${{ runner.temp }}/e-learning-verification"

      - name: 設定 Node
        if: steps.prepare.outputs.node == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安裝鎖定依賴
        if: steps.prepare.outputs.node == 'true'
        run: npm ci --no-audit

      - name: 核對變更、案例及發布門檻
        id: scope
        run: python -B tools/codex/專案驗證.py --check --evidence-dir "${{ runner.temp }}/e-learning-verification"

      - name: 正式依賴弱點閘門
        if: steps.scope.outputs.release == 'true'
        id: audit_prod
        timeout-minutes: 5
        run: python -B tools/codex/專案驗證.py --audit prod --evidence-dir "${{ runner.temp }}/e-learning-verification"

      - name: 完整依賴弱點報告（非阻擋）
        id: audit_all
        if: ${{ !cancelled() && steps.scope.outputs.release == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -B tools/codex/專案驗證.py --audit all --evidence-dir "${{ runner.temp }}/e-learning-verification"

      - name: 記錄依賴弱點狀態
        if: ${{ always() && steps.scope.outputs.release == 'true' }}
        shell: bash
        env:
          PROD_OUTCOME: ${{ steps.audit_prod.outcome }}
          ALL_OUTCOME: ${{ steps.audit_all.outcome }}
        run: |
          {
            echo "### 依賴弱點稽核"
            echo
            echo "- 正式依賴閘門：\`${PROD_OUTCOME}\`"
            echo "- 完整依賴圖（非阻擋報告）：\`${ALL_OUTCOME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ALL_OUTCOME" = "failure" ]; then
            echo "::warning title=完整依賴弱點稽核未通過::請檢查安全告警或登錄服務傳輸錯誤；正式依賴仍由前一步阻擋。"
          fi

      - name: 執行明列案例並沿用有效證據
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.VITE_SUPABASE_ANON_KEY || '' }}
        run: python -B tools/codex/專案驗證.py --restore-ci --evidence-dir "${{ runner.temp }}/e-learning-verification"

      - name: 保存驗證收據與失敗紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 變更驗證證據
          path: ${{ runner.temp }}/e-learning-verification/
          if-no-files-found: ignore
          retention-days: 30

      - name: 上傳網站產物
        if: ${{ steps.scope.outputs.release == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 發布 GitHub Pages
    if: ${{ needs.build.outputs.release == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布至既有 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
