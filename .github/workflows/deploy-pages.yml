name: 驗證與 GitHub Pages 部署

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('pages-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: 完整驗證
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 正式依賴弱點閘門
        id: audit_prod
        timeout-minutes: 5
        run: npm run audit:prod

      - name: 完整依賴弱點報告（非阻擋）
        id: audit_all
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: npm run audit:all

      - name: 記錄依賴弱點狀態
        if: ${{ always() }}
        shell: bash
        env:
          PROD_OUTCOME: ${{ steps.audit_prod.outcome }}
          ALL_OUTCOME: ${{ steps.audit_all.outcome }}
        run: |
          {
            echo "### 依賴弱點稽核"
            echo
            echo "- 正式依賴閘門：\`${PROD_OUTCOME}\`"
            echo "- 完整依賴圖（非阻擋報告）：\`${ALL_OUTCOME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ALL_OUTCOME" = "failure" ]; then
            echo "::warning title=完整依賴弱點稽核未通過::請檢查該步驟；可能是完整依賴圖中的安全告警（含正式、開發或建置依賴），也可能是套件登錄服務傳輸錯誤。正式依賴仍由前一步阻擋。"
          elif [ "$PROD_OUTCOME" = "success" ] && [ "$ALL_OUTCOME" != "success" ]; then
            echo "::warning title=完整依賴弱點稽核未完成::正式依賴閘門已通過，但完整依賴圖沒有成功完成；請檢查該步驟狀態。"
          fi

      - name: 安裝鎖定依賴
        run: npm ci --no-audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify Supabase schema contract
        run: npm run verify:schema

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.VITE_SUPABASE_ANON_KEY || '' }}
        run: npm run build

      - name: Verify production and offline assets
        run: npm run verify:dist

      - name: Upload artifact
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 發布 GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
